<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Regisztráció — NOVA</title><link rel="stylesheet" href="css/style.css"><script src="js/auth.js" defer></script><script src="js/app.js" defer></script></head><body class="auth-body"><main class="auth-wrap"><a class="logo" href="index.html">NOVA<span>.</span></a><section class="auth-card"><span class="eyebrow">CSATLAKOZZ HOZZÁNK</span><h1>Legyen saját <em>fiókod.</em></h1><p class="muted">Hozd létre NOVA-profilodat néhány lépésben.</p><form id="register-form" class="stack-form"><label>Teljes név<input type="text" name="name" required minlength="3" autocomplete="name"></label><label>E-mail-cím<input type="email" name="email" required autocomplete="email"></label><label>Jelszó<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><label>Jelszó megerősítése<input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label><button class="btn btn-primary btn-wide" type="submit">Fiók létrehozása ↗</button></form><p class="auth-switch">Már van fiókod? <a href="login.html">Bejelentkezés</a></p><p class="demo-note">Demóregisztráció: ne használj valódi vagy máshol használt jelszót.</p></section><a class="back-link" href="index.html">← Vissza a főoldalra</a></main><div id="toast-region" class="toast-region" aria-live="polite"></div></body></html>
